Transform: AWS::Serverless-2016-10-31
Description: PDF to deck pipeline with preprocess and process workflows

Parameters:
  HFToken:
    Type: String
    NoEcho: true
    Description: Hugging Face token used by call_model Lambda

Globals:
  Function:
    Timeout: 60
    MemorySize: 512

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket

  JobTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: upload_id
          AttributeType: S
      KeySchema:
        - AttributeName: upload_id
          KeyType: HASH

  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: POST,OPTIONS,GET
        AllowHeaders: Content-Type,Authorization
        AllowOrigin: '*'

  CreateUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/create_upload/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
      Events:
        ApiPost:
          Type: Api
          Properties:
            Path: /upload
            Method: post
            RestApiId: !Ref ApiGateway
        ApiOptions:
          Type: Api
          Properties:
            Path: /upload
            Method: options
            RestApiId: !Ref ApiGateway

  GenerateAudioFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
          PIPER_MODEL: en_US-ljspeech-high.onnx
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: functions/generate_audio
      DockerTag: python3.12-v1

  StartPreprocessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/start_preprocess/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE: !Ref JobTable
          PREPROCESS_STATE_MACHINE_ARN: !Ref PreprocessStateMachine
          PROCESS_STATE_MACHINE_ARN: !Ref ProcessStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt PreprocessStateMachine.Name
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt ProcessStateMachine.Name
      Events:
        ApiPreprocess:
          Type: Api
          Properties:
            Path: /preprocess/{upload_id}
            Method: post
            RestApiId: !Ref ApiGateway
        ApiOptions1:
          Type: Api
          Properties:
            Path: /preprocess/{upload_id}
            Method: options
            RestApiId: !Ref ApiGateway

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/status/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE: !Ref JobTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobTable
      Events:
        ApiGet:
          Type: Api
          Properties:
            Path: /status/{upload_id}
            Method: get
            RestApiId: !Ref ApiGateway
        ApiOptions:
          Type: Api
          Properties:
            Path: /status/{upload_id}
            Method: options
            RestApiId: !Ref ApiGateway

  RenderPreviewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/render_previews/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable

  ExtractTextFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/extract_text/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable

  StartProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/start_processing/
      Handler: app.lambda_handler
      Environment:
        Variables:
          TABLE: !Ref JobTable
          STATE_MACHINE_ARN: !Ref ProcessStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt ProcessStateMachine.Name
      Events:
        ApiPost:
          Type: Api
          Properties:
            Path: /process/{upload_id}
            Method: post
            RestApiId: !Ref ApiGateway
        ApiOptions:
          Type: Api
          Properties:
            Path: /process/{upload_id}
            Method: options
            RestApiId: !Ref ApiGateway

  CropFiguresFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/crop_figures/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable

  CallModelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/call_model/
      Handler: app.lambda_handler
      Timeout: 300
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
          HF_TOKEN: !Ref HFToken
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable

  WriteFinalJsonFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/write_final_json/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable

  CleanupDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      CodeUri: functions/cleanup_data/
      Handler: app.lambda_handler
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          TABLE: !Ref JobTable
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ArtifactBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref JobTable

  PreprocessStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/preprocess.asl.json
      DefinitionSubstitutions:
        ExtractTextFunctionArn: !GetAtt ExtractTextFunction.Arn
        RenderPreviewsFunctionArn: !GetAtt RenderPreviewsFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractTextFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RenderPreviewsFunction

  ProcessStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/process.asl.json
      DefinitionSubstitutions:
        CropFiguresFunctionArn: !GetAtt CropFiguresFunction.Arn
        CallModelFunctionArn: !GetAtt CallModelFunction.Arn
        GenerateAudioFunctionArn: !GetAtt GenerateAudioFunction.Arn
        WriteFinalJsonFunctionArn: !GetAtt WriteFinalJsonFunction.Arn
        CleanupDataFunctionArn: !GetAtt CleanupDataFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref CropFiguresFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CallModelFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GenerateAudioFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref WriteFinalJsonFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CleanupDataFunction

Outputs:
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  JobTableName:
    Value: !Ref JobTable